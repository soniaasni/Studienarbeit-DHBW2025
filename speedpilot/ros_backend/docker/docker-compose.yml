
services:
  speedpilot: &speedpilot
    build:
      context: ../
      dockerfile: docker/Dockerfile
    container_name: speedpilot
    image: speedpilot:latest

    ipc: host
    network_mode: host
    privileged: true
    devices:
      - /dev/gpiomem
      - /dev/mem
    ports:
      - 9091:9091
    environment:
      - DISPLAY
      - XAUTHORITY=/tmp/.Xauthority
    volumes:
      - ${PWD}/../ros2_ws:/root/ros2_ws
      - $HOME/speedpilot/shared/ros2:/root/shared/ros2
      - $HOME/.Xauthority:/tmp/.Xauthority
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - /dev:/dev
      - /sys/class/gpio:/sys/class/gpio
      - /dev/gpiomem:/dev/gpiomem
      - /dev/mem:/dev/mem
    command: ["tail", "-f", "/dev/null"]
